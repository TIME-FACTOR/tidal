name: secret-scan
# Required check: blocks merging any PR whose commits add secrets.
# Uses only shell steps (no third-party actions), matching this repo's locked-down
# Actions allowlist. Scans only the PR's own commits, so old history never blocks new work.
on:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the PR's commits
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git init -q .
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)" \
            fetch -q --no-tags "https://github.com/${REPO}.git" "$BASE" "$HEAD"
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          F=gitleaks_${V}_linux_x64.tar.gz
          curl -sSL -o "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${F}" | sha256sum -c -
          tar xzf "$F" gitleaks
      - name: Scan the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --log-opts="${BASE}..${HEAD}" .
