name: secret-scan
# Required check: blocks merging any PR whose commits add secrets.
# Scans only the PR's own commits, so old history never blocks new work.
on:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          V=8.30.1
          F=gitleaks_${V}_linux_x64.tar.gz
          curl -sSL -o "$F" "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${F}" | sha256sum -c -
          tar xzf "$F" gitleaks
      - name: Scan the PR's commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --no-banner --redact --log-opts="${BASE}..${HEAD}" .
